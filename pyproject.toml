[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "xtop"
version = "0.1.0"
description = "Compact terminal resource monitor"
requires-python = ">=3.8"

[project.optional-dependencies]
gpu = ["nvidia-ml-py"]

[project.scripts]
xtop = "xtop.ui:main"

[tool.setuptools.packages.find]
include = ["xtop*"]
